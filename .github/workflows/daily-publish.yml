# 예약 발행 자동화
#
# Astro 는 정적 사이트라서 "빌드한 순간"의 상태로 고정됩니다.
# 미래 날짜(pubDate)로 예약한 글은, 그 날짜가 지난 뒤 다시 빌드해야 공개됩니다.
#
# 이 워크플로는 매일 한국시간 오전 9시 10분에 돌면서
#   · 오늘 날짜로 예약된 글이 있으면  → 빈 커밋을 push → Vercel 자동 재배포
#   · 없으면                          → 아무것도 하지 않음
#
# ── 설정할 것이 없습니다 ─────────────────────────────────────
# GitHub 이 자동으로 제공하는 GITHUB_TOKEN 만 사용하므로
# Deploy Hook 이나 비밀값(Secret) 등록이 필요하지 않습니다.
# 저장소 Actions 탭에서 "Run workflow" 로 수동 실행도 가능합니다.
# ────────────────────────────────────────────────────────────

name: daily-publish

on:
  schedule:
    # 00:10 UTC = 한국시간 오전 9시 10분
    # (GitHub 무료 플랜의 예정 작업은 수십 분 지연될 수 있습니다)
    - cron: '10 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 오늘 공개할 글이 있는지 확인
        id: check
        run: |
          TODAY=$(TZ=Asia/Seoul date +%Y-%m-%d)
          echo "한국시간 기준 오늘: $TODAY"

          DUE=$(grep -rl "pubDate: $TODAY" src/content/blog/ 2>/dev/null || true)

          if [ -n "$DUE" ]; then
            echo "오늘 공개 예정:"
            echo "$DUE" | sed 's/^/  /'
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "오늘 공개 예정인 글이 없습니다. 재배포를 건너뜁니다."
            echo "due=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 재배포 트리거 (빈 커밋 push → Vercel 자동 배포)
        if: steps.check.outputs.due == 'true'
        run: |
          TODAY=$(TZ=Asia/Seoul date +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: 예약 글 공개 재배포 ($TODAY)"
          git push
          echo "push 완료 — Vercel 이 재배포를 시작합니다."
