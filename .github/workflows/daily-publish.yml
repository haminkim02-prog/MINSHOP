# 예약 발행 자동화
#
# Astro 는 정적 사이트라서 "빌드한 순간"의 상태로 고정됩니다.
# 미래 날짜(pubDate)로 예약한 글은, 그 날짜가 지난 뒤 다시 빌드해야 공개됩니다.
#
# 동작:
#   · 오늘 날짜로 예약된 글이 있고, 아직 오늘 발행을 안 했으면 → 재배포 실행
#   · 그 외에는 아무것도 하지 않음
#
# ── 재배포 방식 ──────────────────────────────────────────────
# ① VERCEL_DEPLOY_HOOK 시크릿이 있으면  → Deploy Hook 호출  ★ 권장
# ② 없으면                              → 커밋 push (Vercel Git 연동에 의존)
#
# ②는 2026-09-28 부터 동작하지 않고 있습니다.
# 봇이 push 한 커밋에 Vercel 이 반응하지 않습니다(같은 날 사람이 push 하면 정상 배포).
# 그래서 ① 방식을 권장합니다.
#
# ── Deploy Hook 설정 방법 (한 번만) ─────────────────────────
# 1) Vercel → minshop → Settings → Git → Deploy Hooks
#    Hook Name: daily-publish   /   Branch: main   → Create Hook
#    생성된 URL 복사
#
# 2) GitHub → MINSHOP → Settings → Secrets and variables → Actions
#    → New repository secret
#    Name:   VERCEL_DEPLOY_HOOK
#    Secret: 위에서 복사한 URL
#    → Add secret
#
# ⚠️ 이 URL 은 비밀값입니다. 알고 있는 사람은 누구나 배포를 실행할 수 있으니
#    채팅이나 문서에 붙여넣지 말고 GitHub 시크릿에만 넣으세요.
# ────────────────────────────────────────────────────────────

name: daily-publish

on:
  schedule:
    # GitHub 무료 플랜의 예정 작업은 지연되거나 폐기될 수 있어 하루 네 번 시도합니다.
    # 한 번만 성공하면 되고, 중복 방지 로직이 나머지를 건너뜁니다.
    - cron: '37 0 * * *' # 09:37 KST
    - cron: '23 3 * * *' # 12:23 KST
    - cron: '47 7 * * *' # 16:47 KST
    - cron: '13 11 * * *' # 20:13 KST
  workflow_dispatch:
    inputs:
      force:
        description: '강제 재배포 (오늘 공개할 글이 없거나 이미 발행했어도 실행)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: 오늘 공개할 글이 있는지 확인
        id: check
        run: |
          TODAY=$(TZ=Asia/Seoul date +%Y-%m-%d)
          echo "한국시간 기준 오늘: $TODAY"
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"

          # 수동 실행 시 force 옵션을 켜면 아래 검사를 모두 건너뛰고 바로 재배포합니다.
          # (Deploy Hook 동작 확인용, 또는 밀린 글을 즉시 올릴 때)
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "강제 재배포 모드입니다. 검사를 건너뛰고 실행합니다."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DUE=$(grep -rl "pubDate: $TODAY" src/content/blog/ 2>/dev/null || true)

          if [ -z "$DUE" ]; then
            echo "오늘 공개 예정인 글이 없습니다. 건너뜁니다."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "오늘 공개 예정:"
          echo "$DUE" | sed 's/^/  /'

          # 같은 날 두 번 배포하지 않도록 방지
          if git log --oneline -20 | grep -qF "예약 글 공개 재배포 ($TODAY)"; then
            echo "오늘 이미 발행했습니다. 건너뜁니다."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "run=true" >> "$GITHUB_OUTPUT"

      # ───────── 방식 ① Deploy Hook (시크릿이 있을 때) ─────────
      - name: 재배포 — Deploy Hook 호출
        id: hook
        if: steps.check.outputs.run == 'true'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK 시크릿이 없습니다. 커밋 push 방식으로 대체합니다."
            echo "used=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CODE=$(curl -s -o /tmp/out.txt -w "%{http_code}" -X POST "$HOOK")
          echo "HTTP $CODE"
          cat /tmp/out.txt || true

          if [ "$CODE" != "200" ] && [ "$CODE" != "201" ]; then
            echo "::error::Deploy Hook 호출 실패 (HTTP $CODE)"
            exit 1
          fi

          echo "Deploy Hook 호출 성공 — Vercel 이 재배포를 시작합니다."
          echo "used=true" >> "$GITHUB_OUTPUT"

      # ───────── 방식 ② 커밋 push (시크릿이 없을 때만) ─────────
      - name: 재배포 — 커밋 push (대체 수단)
        if: steps.check.outputs.run == 'true' && steps.hook.outputs.used == 'false'
        run: |
          TODAY="${{ steps.check.outputs.today }}"
          NOW=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 강제 실행일 때는 커밋 메시지를 다르게 해서 '오늘 발행함' 기록으로 집계되지 않게 합니다.
          # (강제 실행이 그날의 정규 발행을 가로막지 않도록)
          if [ "${{ inputs.force }}" = "true" ]; then
            MSG="chore: 수동 재배포 ($TODAY)"
          else
            MSG="chore: 예약 글 공개 재배포 ($TODAY)"
          fi

          echo "마지막 예약 발행 재배포: $NOW" > .publish-log
          git add .publish-log
          git commit -m "$MSG"
          git push || (git pull --rebase origin main && git push)

          echo "push 완료. (이 방식은 현재 Vercel 이 반응하지 않을 수 있습니다)"

      # Deploy Hook 으로 배포한 경우에도 '오늘 발행함' 기록을 남겨
      # 같은 날 다른 시간대 실행이 중복 배포하지 않도록 합니다.
      - name: 발행 기록 남기기
        if: steps.check.outputs.run == 'true' && steps.hook.outputs.used == 'true'
        run: |
          TODAY="${{ steps.check.outputs.today }}"
          NOW=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "${{ inputs.force }}" = "true" ]; then
            MSG="chore: 수동 재배포 ($TODAY)"
          else
            MSG="chore: 예약 글 공개 재배포 ($TODAY)"
          fi

          echo "마지막 예약 발행 재배포: $NOW (Deploy Hook)" > .publish-log
          git add .publish-log
          git commit -m "$MSG"
          git push || (git pull --rebase origin main && git push)
