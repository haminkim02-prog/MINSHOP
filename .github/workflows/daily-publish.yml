# 예약 발행 자동화
#
# Astro 는 정적 사이트라서 "빌드한 순간"의 상태로 고정됩니다.
# 미래 날짜(pubDate)로 예약한 글은, 그 날짜가 지난 뒤 다시 빌드해야 공개됩니다.
#
# 동작:
#   · 오늘 날짜로 예약된 글이 있고, 아직 오늘 발행을 안 했으면
#     → 빈 커밋을 push → Vercel 자동 재배포
#   · 그 외에는 아무것도 하지 않음
#
# ── 설정할 것이 없습니다 ─────────────────────────────────────
# GitHub 이 자동으로 제공하는 GITHUB_TOKEN 만 사용합니다.
# 저장소 Actions 탭에서 "Run workflow" 로 수동 실행도 가능합니다.
# ────────────────────────────────────────────────────────────

name: daily-publish

on:
  schedule:
    # ⚠️ GitHub 무료 플랜의 예정 작업은 부하가 높으면 지연되거나 아예 폐기됩니다.
    #    (2026-09-23 에 실제로 실행이 누락되어 글이 자동 공개되지 않았습니다)
    #
    #    그래서 하루 네 번 시도합니다. 한 번만 성공하면 되고,
    #    이미 발행한 날은 아래 중복 방지 로직이 걸러내므로 중복 배포가 없습니다.
    #    각 실행은 수십 초라 Actions 사용량에 사실상 영향이 없습니다.
    #
    #    정각·10분 단위는 전 세계 워크플로가 몰려 스킵 확률이 높으므로 어중간한 분으로 잡았습니다.
    - cron: '37 0 * * *' # 00:37 UTC = 한국시간 09:37
    - cron: '23 3 * * *' # 03:23 UTC = 한국시간 12:23
    - cron: '47 7 * * *' # 07:47 UTC = 한국시간 16:47
    - cron: '13 11 * * *' # 11:13 UTC = 한국시간 20:13
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 오늘 이미 발행했는지 커밋 기록에서 확인해야 하므로 히스토리를 넉넉히 가져옵니다
          fetch-depth: 50

      - name: 오늘 공개할 글이 있는지 확인
        id: check
        run: |
          TODAY=$(TZ=Asia/Seoul date +%Y-%m-%d)
          echo "한국시간 기준 오늘: $TODAY"

          DUE=$(grep -rl "pubDate: $TODAY" src/content/blog/ 2>/dev/null || true)

          if [ -z "$DUE" ]; then
            echo "오늘 공개 예정인 글이 없습니다. 건너뜁니다."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "오늘 공개 예정:"
          echo "$DUE" | sed 's/^/  /'

          # 같은 날 두 번 배포하지 않도록 방지 (오전 실행이 성공한 경우 오후 실행은 건너뜀)
          if git log --oneline -20 | grep -qF "예약 글 공개 재배포 ($TODAY)"; then
            echo "오늘 이미 발행했습니다. 건너뜁니다."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: 재배포 트리거 (빈 커밋 push → Vercel 자동 배포)
        if: steps.check.outputs.run == 'true'
        run: |
          TODAY=$(TZ=Asia/Seoul date +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: 예약 글 공개 재배포 ($TODAY)"

          # 그 사이 다른 커밋이 올라왔을 수 있으므로 한 번 재시도
          git push || (git pull --rebase origin main && git push)

          echo "push 완료 — Vercel 이 재배포를 시작합니다."
